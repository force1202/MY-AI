<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUCKY DRAW｜幸運抽獎</title>
<style>
:root{--black:#090909;--red:#a20f18;--gold:#f7cf68;--gold2:#b78327;--cream:#fff5d6;--muted:#c7bca7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#4c1014 0,#19090b 38%,#070707 75%);color:var(--cream);font-family:Arial,"Noto Sans TC",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(135deg,transparent 0 28px,#d4a743 29px,#d4a743 30px,transparent 31px 58px);mask-image:linear-gradient(to bottom,black,transparent 60%)}.app{max-width:1100px;margin:auto;padding:22px 20px 40px;position:relative}header{text-align:center;margin:4px auto 20px}.kicker{letter-spacing:.32em;color:var(--gold);font-size:.78rem;font-weight:800}h1{font-size:clamp(2.2rem,6vw,4.7rem);line-height:1;margin:10px 0;color:var(--gold);text-shadow:0 3px 0 #6b310b,0 0 22px #ffbd3f77;letter-spacing:.04em}.subtitle{color:#e8d5b1;letter-spacing:.08em}.machine{border:3px solid var(--gold2);border-radius:24px;padding:clamp(14px,3vw,30px);background:linear-gradient(145deg,#3a2420,#130d0d 35%,#26120f);box-shadow:0 0 0 5px #26090b,0 0 35px #ffbd3f33,inset 0 0 28px #000;position:relative}.lights{display:flex;justify-content:space-around;gap:7px;margin:0 5px 20px}.lights span{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px #ffd65c;animation:blink 1.4s infinite alternate}.lights span:nth-child(2n){animation-delay:.5s}@keyframes blink{from{opacity:.35;box-shadow:0 0 3px #ffd65c}to{opacity:1;box-shadow:0 0 15px #ffd65c}}.stage{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px solid #805b24;border-radius:16px;background:radial-gradient(ellipse at center,#3a1718 0,#130b0b 65%);position:relative;overflow:hidden;padding:26px 12px}.stage:before{content:"";position:absolute;inset:10px;border:1px solid #c3943c55;border-radius:10px;pointer-events:none}.label{font-size:.82rem;letter-spacing:.28em;color:var(--gold);font-weight:bold}.name{font-size:clamp(2.4rem,8vw,5.8rem);font-weight:900;line-height:1.12;letter-spacing:.04em;overflow-wrap:anywhere;text-shadow:0 0 22px #ffcb5d66;position:relative;z-index:1;margin:18px 0}.name.spinning{animation:shuffle .13s linear infinite}@keyframes shuffle{0%{transform:translateY(-3px);filter:blur(1px)}50%{transform:translateY(3px);filter:blur(0)}100%{transform:translateY(-3px);filter:blur(1px)}}.helper{color:var(--muted);font-size:.95rem;position:relative;z-index:1}.winner .stage{background:radial-gradient(ellipse at center,#8a5b12 0,#451519 42%,#100a0a 78%);box-shadow:inset 0 0 75px #ffd45c66}.winner .name{color:#fff1a6;text-shadow:0 0 10px #fff,0 0 35px #ffca37,0 0 70px #ff7a00}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}.winner .confetti{display:block}.confetti i{position:absolute;top:-15px;width:9px;height:16px;background:var(--gold);animation:fall 2.5s linear infinite}.confetti i:nth-child(3n){background:#ed2637}.confetti i:nth-child(4n){background:#fff0a5}@keyframes fall{to{transform:translateY(390px) rotate(720deg)}}.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:22px 0 8px}button{font:inherit;font-weight:800;cursor:pointer;border:1px solid #d5a844;border-radius:10px;padding:13px 19px;transition:transform .15s,filter .15s}button:hover:not(:disabled){filter:brightness(1.13);transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.primary{color:#260b0b;background:linear-gradient(#ffe89b,#d99b28);box-shadow:0 4px 0 #7a4d13;font-size:1.1rem;min-width:190px}.secondary{color:var(--cream);background:#271718}.danger{color:#ffe5e5;background:#571319;border-color:#a83b42}.status{text-align:center;color:#e4d4b8;min-height:25px;margin:12px 0 2px}.below{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{border:1px solid #77551e;border-radius:14px;background:#100d0de8;padding:18px}.panel h2{font-size:1.05rem;color:var(--gold);margin:0 0 12px;letter-spacing:.05em}.panel p{color:var(--muted);font-size:.9rem;line-height:1.5}textarea{width:100%;min-height:140px;resize:vertical;border:1px solid #785a2a;border-radius:9px;padding:12px;background:#080808;color:#fff2d0;font:1rem/1.7 inherit;font-family:inherit}.smallrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.smallrow button{padding:10px 13px;font-size:.9rem}.counter{color:var(--muted);font-size:.86rem;margin-top:8px}.winners{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}.winners li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#211516;border:1px solid #493020;border-radius:8px}.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(#ffe89b,#c18b2b);color:#2b1207;font-weight:900;flex-shrink:0}.winnername{font-weight:800;overflow-wrap:anywhere}.empty{color:#8f8272;padding:8px 0}footer{text-align:center;color:#8f806a;font-size:.8rem;margin-top:20px}[hidden]{display:none!important}@media(max-width:700px){.below{grid-template-columns:1fr}.stage{min-height:245px}.app{padding:16px 12px 28px}.controls button{flex:1 1 42%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head><body><div class="app"><header><div class="kicker">★ THE LUCKY CASINO ★</div><h1>LUCKY DRAW</h1><div class="subtitle">幸運抽獎・讓好運揭曉</div></header><main><section class="machine" id="machine" aria-label="抽獎拉霸機"><div class="lights" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="stage" aria-live="polite"><div class="confetti" id="confetti" aria-hidden="true"></div><div class="label" id="stageLabel">READY TO PLAY</div><div class="name" id="displayName">LUCKY DRAW</div><div class="helper" id="helper">準備好迎接今天的幸運得主了嗎？</div></div><div class="controls"><button class="primary" id="drawBtn">🎰 開始抽獎</button><button class="secondary" id="fullscreenBtn">⛶ 全螢幕投影</button><button class="secondary" id="listToggle">⚙ 名單設定</button><button class="secondary" id="historyToggle">🏆 得獎紀錄</button></div><div class="status" id="status" role="status">請先在名單設定中輸入參加者。</div></section><div class="below"><section class="panel" id="listPanel"><h2>名單設定 <span style="font-size:.8rem;color:#a99a7c;font-weight:normal">／最多 10 位</span></h2><p>每行輸入一個姓名。開始抽獎後名單會鎖定；若有重複姓名，系統會自動去重並提醒。</p><textarea id="namesInput" aria-label="參加者名單" placeholder="例如：&#10;王小明&#10;陳小美&#10;林大華"></textarea><div class="counter" id="nameCount">0 / 10 位有效參加者</div><div class="smallrow"><button class="primary" id="saveListBtn">保存名單</button><button class="secondary" id="editListBtn" hidden>修改名單</button></div></section><section class="panel" id="historyPanel"><h2>得獎紀錄</h2><p id="historySummary">尚未有得主。抽獎結果會依中獎順序保留。</p><ol class="winners" id="winnerList"><li class="empty">尚無得獎紀錄</li></ol><div class="smallrow"><button class="danger" id="resetBtn">重置整場活動</button></div></section></div></main><footer>V1.0 · 單一 HTML · 離線優先 · 資料保存在此瀏覽器</footer></div>
<script>(()=>{'use strict';const KEY='luckyDrawV1';const $=id=>document.getElementById(id);let state={roster:[],winners:[],locked:false,pending:false};let animationTimer=null;let audioContext=null;const e={machine:$('machine'),stageLabel:$('stageLabel'),displayName:$('displayName'),helper:$('helper'),status:$('status'),drawBtn:$('drawBtn'),fullscreenBtn:$('fullscreenBtn'),listPanel:$('listPanel'),historyPanel:$('historyPanel'),namesInput:$('namesInput'),nameCount:$('nameCount'),saveListBtn:$('saveListBtn'),editListBtn:$('editListBtn'),winnerList:$('winnerList'),historySummary:$('historySummary'),confetti:$('confetti')};function status(s){e.status.textContent=s}function parse(raw){const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),names=[],seen=new Set();let duplicates=0;for(const n of lines){if(seen.has(n)){duplicates++;continue}seen.add(n);names.push(n)}return{names,duplicates,overflow:Math.max(0,names.length-10)}}function save(){try{localStorage.setItem(KEY,JSON.stringify({roster:state.roster,winners:state.winners,locked:state.locked,pending:false}))}catch(err){status('無法保存資料，請確認瀏覽器允許本機儲存。')}}function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&Array.isArray(p.roster)&&Array.isArray(p.winners)){state.roster=p.roster.filter(x=>typeof x==='string').slice(0,10);state.winners=p.winners.filter(x=>typeof x==='string'&&state.roster.includes(x));state.locked=!!p.locked;state.pending=false}}catch(err){status('讀取舊資料失敗，請重新設定名單。')}}function render(){const remaining=state.roster.filter(n=>!state.winners.includes(n));e.namesInput.value=state.roster.join('\n');e.namesInput.disabled=state.locked;e.saveListBtn.hidden=state.locked;e.editListBtn.hidden=!state.locked;e.nameCount.textContent=`${state.roster.length} / 10 位有效參加者${state.locked?' · 名單已鎖定':''}`;e.drawBtn.disabled=state.pending||!remaining.length||!state.locked;e.drawBtn.textContent=state.pending?'抽獎進行中…':remaining.length?'🎰 抽下一位':'🎉 已抽出全部得主';e.winnerList.replaceChildren();if(!state.winners.length){const li=document.createElement('li');li.className='empty';li.textContent='尚無得獎紀錄';e.winnerList.append(li)}else state.winners.forEach((name,i)=>{const li=document.createElement('li'),r=document.createElement('span'),n=document.createElement('span');r.className='rank';r.textContent=String(i+1);n.className='winnername';n.textContent=name;li.append(r,n);e.winnerList.append(li)});e.historySummary.textContent=state.winners.length?`已抽出 ${state.winners.length} 位得主，剩餘 ${remaining.length} 位候選者。`:'尚未有得主。抽獎結果會依中獎順序保留。';if(!state.roster.length){e.stageLabel.textContent='READY TO PLAY';e.displayName.textContent='LUCKY DRAW';e.helper.textContent='請先設定參加者名單。'}else if(!state.winners.length&&!state.pending){e.stageLabel.textContent='READY TO PLAY';e.displayName.textContent='好運即將揭曉';e.helper.textContent=`目前有 ${state.roster.length} 位參加者，按下開始抽獎。`}}function sound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext=audioContext||new AC();if(audioContext.state==='suspended')audioContext.resume();const t=audioContext.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.12);g.gain.exponentialRampToValueAtTime(.16,t+i*.12+.025);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.65);o.connect(g);g.connect(audioContext.destination);o.start(t+i*.12);o.stop(t+i*.12+.7)})}catch(err){}}function confetti(){e.confetti.replaceChildren();for(let i=0;i<48;i++){const b=document.createElement('i');b.style.left=Math.random()*100+'%';b.style.animationDelay=Math.random()*1.8+'s';b.style.animationDuration=1.7+Math.random()*1.8+'s';e.confetti.append(b)}}function draw(){if(state.pending)return;if(!state.locked){status('請先保存名單，再開始抽獎。');e.listPanel.scrollIntoView({behavior:'smooth',block:'center'});return}const remaining=state.roster.filter(n=>!state.winners.includes(n));if(!state.roster.length){status('名單是空的，請先加入參加者。');return}if(!remaining.length){status('所有參加者都已中獎，本場抽獎已完成。');return}const winner=remaining[Math.floor(Math.random()*remaining.length)];state.pending=true;save();render();e.machine.classList.remove('winner');e.stageLabel.textContent='GOOD LUCK!';e.helper.textContent='幸運轉動中，準備揭曉……';e.displayName.classList.add('spinning');let ticks=0;const spin=setInterval(()=>{e.displayName.textContent=remaining[Math.floor(Math.random()*remaining.length)];if(++ticks>=60)clearInterval(spin)},110);animationTimer=setTimeout(()=>{clearInterval(spin);state.winners.push(winner);state.pending=false;save();e.displayName.classList.remove('spinning');e.machine.classList.add('winner');confetti();sound();render();e.stageLabel.textContent='★ WINNER ★';e.displayName.textContent=winner;e.helper.textContent=`恭喜！第 ${state.winners.length} 位得主`;status(state.roster.some(n=>!state.winners.includes(n))?'恭喜得主！可以繼續抽下一位。':'恭喜！所有得主已全部揭曉。')},8000)}function saveList(){if(state.locked)return;const p=parse(e.namesInput.value);if(!p.names.length){status('名單不可為空，請至少輸入 1 位參加者。');return}if(p.overflow){status(`最多只能有 10 位不重複參加者，目前有 ${p.names.length} 位。請刪除多餘姓名。`);return}state.roster=p.names;state.winners=[];state.locked=true;save();render();status(p.duplicates?`名單已保存，已自動去除 ${p.duplicates} 個重複姓名。`:`名單已保存，共 ${state.roster.length} 位參加者。抽獎開始後將鎖定名單。`)}function unlock(){if(state.pending)return;if(state.winners.length&&!confirm('修改名單會清除目前得獎紀錄，確定要繼續嗎？'))return;if(state.winners.length)state.winners=[];state.locked=false;e.machine.classList.remove('winner');e.confetti.replaceChildren();render();status('名單已解鎖，修改完成後請重新保存。')}function reset(){const msg=state.pending?'抽獎動畫正在進行。重置將取消這次尚未完成的抽獎並清除全部資料，確定嗎？':'確定要重置整場活動嗎？名單與所有得獎紀錄都會清除，且無法復原。';if(!confirm(msg))return;if(animationTimer)clearTimeout(animationTimer);state={roster:[],winners:[],locked:false,pending:false};e.machine.classList.remove('winner');e.displayName.classList.remove('spinning');e.confetti.replaceChildren();try{localStorage.removeItem(KEY)}catch(err){}render();status('活動已重置，請重新設定名單。')}$('drawBtn').addEventListener('click',draw);e.saveListBtn.addEventListener('click',saveList);e.editListBtn.addEventListener('click',unlock);$('resetBtn').addEventListener('click',reset);$('listToggle').addEventListener('click',()=>e.listPanel.scrollIntoView({behavior:'smooth',block:'center'}));$('historyToggle').addEventListener('click',()=>e.historyPanel.scrollIntoView({behavior:'smooth',block:'center'}));e.fullscreenBtn.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(err){status('此瀏覽器不支援全螢幕，請使用瀏覽器選單切換。')}});e.namesInput.addEventListener('input',()=>{const p=parse(e.namesInput.value);e.nameCount.textContent=`${p.names.length} / 10 位有效參加者${p.duplicates?` · 發現 ${p.duplicates} 個重複姓名`:''}`});load();render();if(state.roster.length){status(`已恢復名單與 ${state.winners.length} 筆得獎紀錄。未完成的抽獎不會計入得獎。`);if(state.winners.length){e.machine.classList.add('winner');confetti();e.stageLabel.textContent='★ LAST WINNER ★';e.displayName.textContent=state.winners[state.winners.length-1];e.helper.textContent=`目前共 ${state.winners.length} 位得主`}}})();</script></body></html>
